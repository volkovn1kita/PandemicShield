version: '3.8'

services:
  # 1. Брокер повідомлень
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pandemic_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    # Готовий, коли AMQP-порт приймає з'єднання (а не лише коли запущено вузол)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  # 2. База даних
  postgres:
    image: postgres:15-alpine
    container_name: pandemic_db
    environment:
      POSTGRES_USER: adminpostgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: pandemic_shield_db
    ports:
      - "5433:5432"
    # -h 127.0.0.1: під час ініціалізації Postgres слухає лише unix-сокет, тож TCP-перевірка не спрацює раніше часу
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "adminpostgres", "-d", "pandemic_shield_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 3. Парсер (gRPC сервер)
  parser:
    build:
      context: .
      dockerfile: PandemicShield.Parser/Dockerfile
    container_name: pandemic_parser
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080 
      - RABBITMQ_HOST=rabbitmq
      # Розмір ядра вікна і перекриття в нуклеотидах (ORF, коротші за перекриття, не губляться на межах)
      - WINDOW_CORE_SIZE=262144
      - WINDOW_FLANK_SIZE=32768
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 4. Воркер (Аналізатор)
  worker:
    build:
      context: .
      dockerfile: PandemicShield.Worker/Dockerfile
    container_name: pandemic_worker
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - API_URL=http://api:8080
      # Мінімальна довжина ORF у нуклеотидах і таблиця генетичного коду NCBI (1 — стандартна, 11 — бактерії)
      - ORF_MIN_LENGTH=75
      - GENETIC_CODE=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # 5. Агрегатор (Збереження результатів)
  aggregator:
    build:
      context: .
      dockerfile: PandemicShield.Aggregator/Dockerfile
    container_name: pandemic_aggregator
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 6. Nextclade-воркер (клади, лінії, QC і мутації вірусних геномів)
  nextclade:
    build:
      context: .
      dockerfile: PandemicShield.Nextclade/Dockerfile
    container_name: pandemic_nextclade
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    volumes:
      - run_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # 7. Воркер AMRFinderPlus (гени та мутації резистентності бактерій)
  amrfinder:
    build:
      context: .
      dockerfile: PandemicShield.AmrFinder/Dockerfile
    container_name: pandemic_amrfinder
    # Воркер зібрано під linux-x64; на Apple Silicon Docker запустить його через емуляцію
    platform: linux/amd64
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    volumes:
      - run_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # 8. Воркер MLST (тип штаму бактерій за схемами PubMLST)
  mlst:
    build:
      context: .
      dockerfile: PandemicShield.Mlst/Dockerfile
    container_name: pandemic_mlst
    # Образ staphb/mlst зібрано лише під linux/amd64; на Apple Silicon Docker запустить його через емуляцію
    platform: linux/amd64
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    volumes:
      - run_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # 9. Воркер Reads (FASTQ → консенсус вірусу або збірка бактерії)
  reads:
    build:
      context: .
      dockerfile: PandemicShield.Reads/Dockerfile
    container_name: pandemic_reads
    # Інструменти bioconda (SKESA, Flye) зібрано під linux/amd64; на Apple Silicon Docker запустить їх через емуляцію
    platform: linux/amd64
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DATA_DIR=/data
      # Пам'ять для SKESA у ГБ: бактеріальний геном з покриттям ~50× вміщається у 8
      - READS_MEMORY_GB=8
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
    volumes:
      - run_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # 10. Центр Керування (API)
  api:
    build:
      context: .
      dockerfile: PandemicShield.Api/Dockerfile
    container_name: pandemic_api
    # Підстраховка: якщо міграція бази впаде з тимчасової причини, контейнер перезапуститься сам
    restart: always
    ports:
      - "5020:8080" # Відкриваємо порт 5020 назовні для Postman і Фронтенду
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ParserUrl=http://parser:8080 # Адреса Парсера у внутрішній мережі!
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pandemic_shield_db;Username=adminpostgres;Password=rootpassword
      - RABBITMQ_HOST=rabbitmq
      # Спільний том для файлів запусків (їх читає Nextclade-воркер)
      - DATA_DIR=/data
      # Набори даних Nextclade, встановлені в образі воркера (див. PandemicShield.Nextclade/Dockerfile)
      - NEXTCLADE_DATASETS=nextstrain/sars-cov-2/wuhan-hu-1/orfs,nextstrain/flu/h1n1pdm/ha/CY121680,nextstrain/flu/h3n2/ha/EPI1857216,nextstrain/rsv/a/EPI_ISL_412866,nextstrain/rsv/b/EPI_ISL_1653999,nextstrain/mpox/all-clades
      # Необов'язковий ключ NCBI для імпорту: 10 запитів на секунду замість 3 (https://account.ncbi.nlm.nih.gov/settings/)
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    volumes:
      - run_data:/data
    depends_on:
      parser:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  run_data:
